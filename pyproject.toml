[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "mangatraductor"
version = "0.2.0"
description = "OCR Japanese manga speech bubbles, translate them with DeepL and typeset the translation."
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Andrés Guerrero Jaramillo" }]
dependencies = [
    "Pillow>=10.1",
    "requests>=2.31",
]

[project.optional-dependencies]
# The OCR model needs PyTorch + Transformers; kept optional so tests and CI stay light.
ocr = ["torch", "transformers>=4.30"]
dev = ["pytest>=8", "ruff>=0.6"]

[project.scripts]
mangatraductor = "mangatraductor.cli:main"

[project.gui-scripts]
mangatraductor-gui = "mangatraductor.gui:main"

[tool.setuptools]
packages = ["mangatraductor"]

[tool.setuptools.package-data]
mangatraductor = ["fonts/*.ttf"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py310"
